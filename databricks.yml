bundle:
  name: clickstream-kitchen

resources:
  jobs:
    clickstream_etl:
      name: clickstream-etl
      tasks:
        - task_key: run_etl
          spark_python_task:
            python_file: ./src/etl_job.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"

targets:
  dev:
    mode: development
    default: true